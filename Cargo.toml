[package]
name = "certval-cli"
version = "0.1.0-rc.1"
description = """
An openssl-style command-line tool for X.509 certificates, CRLs, OCSP and DER, with RFC 5280
certification path validation by certval.
"""
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-cli"
categories = ["command-line-utilities", "cryptography"]
keywords = ["x509", "pki", "certval", "ocsp", "cli"]
readme = "README.md"
edition = "2021"
rust-version = "1.88"
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-APACHE", "LICENSE-MIT"]

[[bin]]
name = "certval"
path = "src/main.rs"

[dependencies]
certval = { version = "0.2.0-rc.1", features = ["remote", "rsa"] }
certval_stores_core = "0.1.0-rc.1"
certval_stores_fpki = "1.0.0-rc.1"
certval_stores_webpki_root_certs = "1.0.0-rc.1"

clap = { version = "4.6.7", features = ["derive"] }
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.3", features = ["alloc", "oid", "pem"] }
getrandom = "0.4.3"
pem-rfc7468 = { version = "1.0.0", features = ["alloc"] }
reqwest = { version = "0.13.4", default-features = false }
sha2 = "0.11.0"
spki = "0.8.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
x509-cert = "0.3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Uncomment while developing certval and this crate together: it redirects the crates.io dependency
# above to the local checkout, so edits take effect without a publish. Leave it commented on anything
# that is committed, or the build depends on a path that only exists here.
# [patch.crates-io]
# certval = { path = "../rust-pki/certval" }
