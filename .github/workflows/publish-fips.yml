# Adds certval-fips to a published release, from the staging draft add-fips.yml made, once its
# macOS and Windows archives hold signed binaries and libraries: checks the signatures, uploads the
# archives to the release without replacing any file it already holds, adds their lines to its
# SHA256SUMS, attests them, notes them in the release notes, and deletes the staging draft (a draft
# has no git tag until it is published, so there is none to delete). Run by hand:
#
#   gh workflow run publish-fips.yml --repo carl-wallace/certval-cli -f release_tag=certval-cli-v<version>
#
# require_signatures (default true) refuses unless every macOS executable and library carries Red
# Hound Software's Developer ID signature (the executables notarized) and every Windows executable
# and DLL its Authenticode signature, each timestamped.
name: publish-fips

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "The published release (certval-cli-v<version>) whose staging draft to add"
        required: true
      require_signatures:
        description: "Refuse unless the macOS and Windows binaries and libraries are signed"
        type: boolean
        default: true

env:
  SIGNER: "Red Hound Software, Inc."
  APPLE_TEAM_ID: M355KP63QV
  RELEASE_TAG: ${{ inputs.release_tag }}
  STAGING_TAG: ${{ inputs.release_tag }}-fips-staging

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A draft is visible only with write access, so reading one needs contents: write, though
    # this job changes nothing.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          [ "$(gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] \
            || { echo "$STAGING_TAG is not a draft"; exit 1; }
          [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ] \
            || { echo "$RELEASE_TAG is not a published release"; exit 1; }
          # Nothing the staging draft holds may already be in the release: this only adds.
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > release.txt
          gh release view "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > staging.txt
          if grep -Fxf staging.txt release.txt; then echo "the release already holds the files above"; exit 1; fi

  verify-macos:
    needs: check
    if: inputs.require_signatures
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release download "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-apple-darwin.tar.gz' --dir dist
      - name: Every executable and library is signed by Red Hound Software
        run: |
          for archive in dist/*.tar.gz; do tar xzf "$archive" -C dist; done
          n=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^Mach-O' || continue
            n=$((n + 1))
            codesign --verify --strict --verbose=2 "$f"
            info=$(codesign -dv --verbose=2 "$f" 2>&1)
            echo "$info" | grep -qF "Authority=Developer ID Application: $SIGNER ($APPLE_TEAM_ID)"
            echo "$info" | grep -q "flags=.*runtime"
            echo "$info" | grep -q "^Timestamp="
            # Notarization is assessed on the executables; the libraries are covered by the
            # submission that held them.
            if file -b "$f" | grep -q 'executable'; then
              spctl --assess --type open --context context:primary-signature --verbose=2 "$f" 2>&1 | tee spctl.txt
              grep -q "source=Notarized Developer ID" spctl.txt
            fi
          done < <(find dist -mindepth 2 -type f -print0)
          [ "$n" -gt 0 ] || { echo "no Mach-O file in the macOS archives"; exit 1; }
          echo "$n Mach-O files signed"

  verify-windows:
    needs: check
    if: inputs.require_signatures
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: gh release download "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-pc-windows-msvc.zip' --dir dist
      - name: Every executable and DLL is signed by Red Hound Software
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath dist }
          $files = @(Get-ChildItem dist -Recurse -Include *.exe, *.dll)
          if ($files.Count -eq 0) { throw "no .exe or .dll in the Windows archives" }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            $sig | Format-List Path, Status, SignerCertificate, TimeStamperCertificate
            if ($sig.Status -ne 'Valid') { throw "$($f.Name): signature status $($sig.Status)" }
            if ($sig.SignerCertificate.Subject -notlike "*$env:SIGNER*") {
              throw "$($f.Name): signed by $($sig.SignerCertificate.Subject)"
            }
            if (-not $sig.TimeStamperCertificate) { throw "$($f.Name): signature is not timestamped" }
          }

  publish:
    needs: [check, verify-macos, verify-windows]
    if: >-
      always() && needs.check.result == 'success' &&
      (needs.verify-macos.result == 'success' || needs.verify-macos.result == 'skipped') &&
      (needs.verify-windows.result == 'success' || needs.verify-windows.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNED: ${{ inputs.require_signatures }}
    steps:
      - name: Download
        run: |
          gh release download "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'certval-cli-fips-*' --dir dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir old
      # The release's SHA256SUMS with the new archives' lines added; its existing lines unchanged.
      - name: Checksums
        run: |
          (cat old/SHA256SUMS; cd dist && sha256sum certval-cli-fips-*) > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/certval-cli-fips-*
      - name: Notes
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          if [ "$SIGNED" = true ]; then signed="signed, as the other macOS and Windows binaries are"; else signed="not code-signed"; fi
          cat >> notes.md <<EOF

          ## certval-fips

          certval-cli-fips-* holds certval-fips, the certval command built with FIPS-validated cryptographic modules, added on $(date -u +%Y-%m-%d) from this release's tag: AWS-LC's FIPS module (--crypto aws-lc) on every platform, and OpenSSL's FIPS provider (--crypto openssl) bundled on macOS and through the system's OpenSSL on Linux. Each archive's FIPS.md says how to use it; on macOS, run fips-setup.sh once before using OpenSSL's FIPS provider. The macOS and Windows binaries and libraries are $signed. The modules are validated; this build of certval is not itself a validated module.
          EOF
      - name: Add to the release
        run: |
          # Without --clobber, an upload of a name the release already holds fails.
          gh release upload "$RELEASE_TAG" dist/certval-cli-fips-* --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          gh release delete "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --yes
