name: certval-cli

on:
  pull_request:
  push:
    branches: main
  # Manual re-runs via `gh workflow run ci.yml` (available once this file is
  # on the default branch).
  workflow_dispatch:

defaults:
  run:
    working-directory: certval-cli

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        rust:
          - 1.88.0 # MSRV, matching certval
          - stable
    runs-on: ${{ matrix.os }}
    steps:
      # certval comes from crates.io, so no sibling checkout is needed here.
      - uses: actions/checkout@v7
        with:
          path: certval-cli
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo build --all-targets

  # Lints run on stable only, deliberately not across the build matrix: clippy's diagnostics differ
  # between toolchains, so linting against the MSRV pin reports on a compiler nobody develops with.
  # The pre-commit hook runs the same command locally so it fails before a push rather than in CI.
  # It is an early warning, not a replacement for this job.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Not installed by default.
          components: clippy
      # No features, so one clippy shape covers the crate.
      - run: cargo clippy --all-targets

  # A job of its own so it can be a required check without making clippy one: each Rust release
  # adds lints, and a required clippy would fail unrelated pull requests.
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-cli
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Not installed by default.
          components: rustfmt
      - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-cli
      # The example files the tests run the binary against live in rust-pki's test data and are
      # pointed at rather than copied. Pinned to the commit the certval release in Cargo.toml was
      # published from (certval-v0.2.0-rc.1); bump both together.
      - uses: actions/checkout@v7
        with:
          repository: carl-wallace/rust-pki
          ref: 93104f49a8083f1e527e3b4e830581b917674e2f
          path: rust-pki
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the unit and command tests
        env:
          CERTVAL_CLI_EXAMPLES: ${{ github.workspace }}/rust-pki/certval/tests/examples
        run: cargo test
