# Builds the certval command for Linux, macOS and Windows and puts the binaries in a draft GitHub
# release, for the macOS and Windows binaries to be signed and the release published by publish.yml.
# A push of a tag named certval-cli-v<version> makes the draft; <version> must be the version in
# Cargo.toml.
#
# Everything but the signatures is done here, from the tag, so that what is signed is what CI built:
# each archive carries a build provenance attestation, which is checked before what is in it is
# signed. Signing replaces the macOS and Windows archives in the draft with archives of the signed
# binaries, under the same names; publish.yml then checks the signatures, writes SHA256SUMS and an
# attestation over the final files, and publishes.
#
# A manual run builds and smoke-tests the same binaries and keeps them as workflow artifacts, without
# making a release, which is how to try a change to this workflow before tagging. A manual run given
# release_tag builds from that existing tag and makes its draft: the way a tag pushed before this
# workflow existed gets a release. Run it from the tag (`gh workflow run release.yml --ref <tag> -f
# release_tag=<tag>`), so that the provenance names the tag and its commit, not the branch the run
# was started from; the signing scripts refuse an archive whose provenance does not name the tag.
#
# No draft is made from a commit whose CI has not passed; see the ci job. BUILT-SHA256SUMS, attested
# with the archives, lists them as built, before signing replaces the macOS and Windows ones, and
# stays in the published release.
#
# The release notes, and the README.md attached to the release, come from .github/release/README.md
# as it stands where this workflow runs from (the tag, or on a manual run the branch it is run on),
# not from the tag being built, so a release of an older tag gets the current text.
name: release

on:
  push:
    tags: ["certval-cli-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag (certval-cli-v<version>) to build and make a draft release of; empty to build without one"
        required: false
        default: ""
      skip_ci_check:
        description: "Make the draft even though CI has not passed on the tag's commit (the release notes say so)"
        type: boolean
        default: false

jobs:
  # CI must have passed on the commit being built. ci.yml runs on every push to main and every pull
  # request, so a merged commit has a run, which may still be going when the tag is pushed: this
  # waits for it. A manual run can pass skip_ci_check, e.g. when CI failed for a reason unrelated to
  # the change; the draft's notes then say that CI had not passed. A tag push cannot skip it, and a
  # build without a release only reports the result.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ inputs.release_tag || github.sha }}
      WORKFLOWS: ci.yml
      RELEASING: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '' }}
      SKIP: ${{ inputs.skip_ci_check }}
    outputs:
      skipped: ${{ steps.ci.outputs.skipped }}
      sha: ${{ steps.ci.outputs.sha }}
    steps:
      - name: CI passed on the commit being built
        id: ci
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          failed=""
          for wf in $WORKFLOWS; do
            while :; do
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$sha" \
                --jq '[.workflow_runs[] | .conclusion // "pending"] | join(" ")')
              echo "$wf on $sha: ${runs:-no run}"
              case " $runs " in
                *" success "*) break ;;
                *" pending "*) sleep 60 ;;
                *) failed="$failed $wf"; break ;;
              esac
            done
          done
          if [ -z "$failed" ]; then
            exit 0
          elif [ "$RELEASING" != true ]; then
            echo "::warning::CI has not passed on $sha:$failed; a build without a release goes ahead"
          elif [ "$SKIP" = true ]; then
            echo "::warning::CI has not passed on $sha:$failed; building anyway (skip_ci_check)"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CI has not passed on $sha:$failed"
            exit 1
          fi

  build:
    needs: ci
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than ubuntu-latest so the binary needs only glibc 2.35, and runs on older
          # distributions as well as current ones. AWS-LC and rustls are linked statically and the
          # openssl feature is left off, so glibc is the only system library the binary loads; the
          # release README says how to build with openssl.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            builds: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            features: ""
            crypto: aws-lc
            archive: tar.gz
          # One universal binary, for Apple silicon and Intel Macs alike: both are built and
          # combined with lipo, under the name cargo-binstall looks for on any Mac. cryptokit
          # compiles certval-security-framework's Swift shim, which needs the macOS 26 SDK; the shim
          # checks for macOS 26 before each CryptoKit call, so the binary runs on older macOS with
          # those algorithms left to software.
          - os: macos-latest
            target: universal-apple-darwin
            builds: aarch64-apple-darwin x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            features: "--features cryptokit"
            crypto: security-framework
            archive: tar.gz
          # build.rs gives the binary an 8 MB main-thread stack on Windows.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            builds: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            features: ""
            crypto: cng
            archive: zip
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      # The PKITS files the smoke test validates, from the rust-pki commit ci.yml's test job pins;
      # bump both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: carl-wallace/rust-pki
          ref: 93104f49a8083f1e527e3b4e830581b917674e2f
          path: rust-pki
          sparse-checkout: certval/tests/examples/PKITS_data_2048
      # A fixed version rather than stable, so that a release can be rebuilt with the compiler that
      # built it; bump it on purpose.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.rust_targets }}
      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "certval-cli") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: |
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          if [ "$tag" != "certval-cli-v${{ steps.version.outputs.version }}" ]; then
            echo "tag $tag does not match certval-cli ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - name: Build
        run: |
          for t in ${{ matrix.builds }}; do
            cargo build --release --locked --bin certval --target "$t" ${{ matrix.features }}
          done
      # The binary to package: the one build, or on macOS the two combined.
      - name: Combine
        id: bin
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p universal
            lipo -create -output universal/certval \
              target/aarch64-apple-darwin/release/certval target/x86_64-apple-darwin/release/certval
            lipo -archs universal/certval
            echo "path=universal/certval" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/${{ matrix.target }}/release/certval$exe" >> "$GITHUB_OUTPUT"
          fi
      # A PKITS path validated by software, then by the platform's implementation alone (--only),
      # so that a provider that fails to load or answer fails the build. On macOS this runs the
      # runner's own slice of the universal binary.
      - name: Smoke test
        run: |
          bin=${{ steps.bin.outputs.path }}
          certs=rust-pki/certval/tests/examples/PKITS_data_2048/certs
          "$bin" --version
          "$bin" verify --list-stores
          for crypto in software ${{ matrix.crypto }}; do
            only=""
            if [ "$crypto" != software ]; then only=--only; fi
            "$bin" verify --crypto "$crypto" $only \
              --anchor "$certs/TrustAnchorRootCertificate.crt" \
              --chain "$certs/GoodCACert.crt" \
              "$certs/ValidCertificatePathTest1EE.crt" | tee smoke.txt
            grep -q "path 0: Valid" smoke.txt
          done
      - name: Package
        id: package
        run: |
          name=certval-cli-${{ steps.version.outputs.version }}-${{ matrix.target }}
          mkdir "$name"
          cp ${{ steps.bin.outputs.path }} "$name"/
          cp README.md CHANGELOG.md LICENSE-APACHE LICENSE-MIT "$name"/
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "file=$name.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  draft:
    needs: [ci, build]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CI_SKIPPED: ${{ needs.ci.outputs.skipped }}
      CI_SHA: ${{ needs.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      # A provenance attestation for each archive as built, which the signing scripts check before
      # signing what is in it: `gh attestation verify <file> --repo carl-wallace/certval-cli
      # --signer-workflow carl-wallace/certval-cli/.github/workflows/release.yml --source-ref
      # refs/tags/<tag>`.
      # BUILT-SHA256SUMS is attested too: it stays in the release, and lists the macOS and Windows
      # archives as they were before signing replaced them.
      - name: Built checksums
        working-directory: dist
        run: sha256sum certval-cli-* | tee BUILT-SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/certval-cli-*
            dist/BUILT-SHA256SUMS
      - name: README
        run: |
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          version=${tag#certval-cli-v}
          sed -e "s/@VERSION@/$version/g" -e "s/@TAG@/$tag/g" .github/release/README.md > dist/README.md
          if [ "$CI_SKIPPED" = true ]; then
            printf '\n**CI had not passed on commit %s when this release was built.**\n' "$CI_SHA" >> dist/README.md
          fi
          cat dist/README.md
      - name: Draft release
        run: |
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          version=${tag#certval-cli-v}
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "certval-cli $version" \
            --notes-file dist/README.md \
            $prerelease
