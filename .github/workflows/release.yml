# Builds the certval command for Linux, macOS and Windows and puts the binaries in a draft GitHub
# release, for the macOS and Windows binaries to be signed and the release published by publish.yml.
# A push of a tag named certval-cli-v<version> makes the draft; <version> must be the version in
# Cargo.toml.
#
# Everything but the signatures is done here, from the tag, so that what is signed is what CI built:
# each archive carries a build provenance attestation, which is checked before what is in it is
# signed. Signing replaces the macOS and Windows archives in the draft with archives of the signed
# binaries, under the same names; publish.yml then checks the signatures, writes SHA256SUMS and an
# attestation over the final files, and publishes.
#
# A manual run builds and smoke-tests the same binaries and keeps them as workflow artifacts, without
# making a release, which is how to try a change to this workflow before tagging. A manual run given
# release_tag builds from that existing tag and makes its draft: the way a tag pushed before this
# workflow existed gets a release.
#
# The release notes, and the README.md attached to the release, come from .github/release/README.md
# as it stands where this workflow runs from (the tag, or on a manual run the branch it is run on),
# not from the tag being built, so a release of an older tag gets the current text.
name: release

on:
  push:
    tags: ["certval-cli-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag (certval-cli-v<version>) to build and make a draft release of; empty to build without one"
        required: false
        default: ""

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than ubuntu-latest so the binary needs only glibc 2.35, and runs on older
          # distributions as well as current ones. AWS-LC and rustls are linked statically and the
          # openssl feature is left off, so glibc is the only system library the binary loads; the
          # release README says how to build with openssl.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            builds: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            features: ""
            crypto: aws-lc
            archive: tar.gz
          # One universal binary, for Apple silicon and Intel Macs alike: both are built and
          # combined with lipo, under the name cargo-binstall looks for on any Mac. cryptokit
          # compiles certval-security-framework's Swift shim, which needs the macOS 26 SDK; the shim
          # checks for macOS 26 before each CryptoKit call, so the binary runs on older macOS with
          # those algorithms left to software.
          - os: macos-latest
            target: universal-apple-darwin
            builds: aarch64-apple-darwin x86_64-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            features: "--features cryptokit"
            crypto: security-framework
            archive: tar.gz
          # build.rs gives the binary an 8 MB main-thread stack on Windows.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            builds: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            features: ""
            crypto: cng
            archive: zip
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      # The PKITS files the smoke test validates, from the rust-pki commit ci.yml's test job pins;
      # bump both together.
      - uses: actions/checkout@v7
        with:
          repository: carl-wallace/rust-pki
          ref: 93104f49a8083f1e527e3b4e830581b917674e2f
          path: rust-pki
          sparse-checkout: certval/tests/examples/PKITS_data_2048
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - name: Read the version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "certval-cli") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: |
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          if [ "$tag" != "certval-cli-v${{ steps.version.outputs.version }}" ]; then
            echo "tag $tag does not match certval-cli ${{ steps.version.outputs.version }}"
            exit 1
          fi
      - name: Build
        run: |
          for t in ${{ matrix.builds }}; do
            cargo build --release --locked --bin certval --target "$t" ${{ matrix.features }}
          done
      # The binary to package: the one build, or on macOS the two combined.
      - name: Combine
        id: bin
        run: |
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then exe=.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p universal
            lipo -create -output universal/certval \
              target/aarch64-apple-darwin/release/certval target/x86_64-apple-darwin/release/certval
            lipo -archs universal/certval
            echo "path=universal/certval" >> "$GITHUB_OUTPUT"
          else
            echo "path=target/${{ matrix.target }}/release/certval$exe" >> "$GITHUB_OUTPUT"
          fi
      # A PKITS path validated by software, then by the platform's implementation alone (--only),
      # so that a provider that fails to load or answer fails the build. On macOS this runs the
      # runner's own slice of the universal binary.
      - name: Smoke test
        run: |
          bin=${{ steps.bin.outputs.path }}
          certs=rust-pki/certval/tests/examples/PKITS_data_2048/certs
          "$bin" --version
          "$bin" verify --list-stores
          for crypto in software ${{ matrix.crypto }}; do
            only=""
            if [ "$crypto" != software ]; then only=--only; fi
            "$bin" verify --crypto "$crypto" $only \
              --anchor "$certs/TrustAnchorRootCertificate.crt" \
              --chain "$certs/GoodCACert.crt" \
              "$certs/ValidCertificatePathTest1EE.crt" | tee smoke.txt
            grep -q "path 0: Valid" smoke.txt
          done
      - name: Package
        id: package
        run: |
          name=certval-cli-${{ steps.version.outputs.version }}-${{ matrix.target }}
          mkdir "$name"
          cp ${{ steps.bin.outputs.path }} "$name"/
          cp README.md CHANGELOG.md LICENSE-APACHE LICENSE-MIT "$name"/
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "file=$name.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/release
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A provenance attestation for each archive as built, which the signing scripts check with
      # `gh attestation verify <file> --repo carl-wallace/certval-cli` before signing what is in it.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/certval-cli-*
      - name: README
        run: |
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          version=${tag#certval-cli-v}
          sed -e "s/@VERSION@/$version/g" -e "s/@TAG@/$tag/g" .github/release/README.md > dist/README.md
          cat dist/README.md
      - name: Draft release
        run: |
          tag=${RELEASE_TAG:-$GITHUB_REF_NAME}
          version=${tag#certval-cli-v}
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "certval-cli $version" \
            --notes-file dist/README.md \
            $prerelease
